services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\Typo3AiChat\:
    resource: '../Classes/*'

  Webconsulting\Typo3AiChat\Controller\ChatModuleController:
    public: true

  Webconsulting\Typo3AiChat\Controller\ChatApiController:
    public: true

  # Processor: defaults to exec, override for worker mode
  Webconsulting\Typo3AiChat\Service\ChatProcessorInterface:
    class: Webconsulting\Typo3AiChat\Service\ExecChatProcessor

  # Register webconsulting_ai_chat_tools cache as a DI service via CacheManager factory
  cache.webconsulting_ai_chat_tools:
    class: 'TYPO3\CMS\Core\Cache\Frontend\FrontendInterface'
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      $identifier: 'webconsulting_ai_chat_tools'

  # MCP Tool Provider: interface alias with explicit cache argument to avoid ambiguous autowiring
  Webconsulting\Typo3AiChat\Mcp\McpToolProviderInterface:
    class: Webconsulting\Typo3AiChat\Mcp\McpToolProvider
    arguments:
      $cache: '@cache.webconsulting_ai_chat_tools'

  Webconsulting\Typo3AiChat\Mcp\McpToolProvider:
    arguments:
      $cache: '@cache.webconsulting_ai_chat_tools'

  # Document extractors — tagged for DocumentExtractorRegistry
  Webconsulting\Typo3AiChat\Document\DocumentExtractorRegistry:
    arguments:
      - !tagged_iterator document.extractor

  Webconsulting\Typo3AiChat\Document\Extractor\PdfExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\DocxExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\XlsxExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\PlainTextExtractor:
    tags: ['document.extractor']
