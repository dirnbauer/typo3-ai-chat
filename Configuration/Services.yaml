services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\Typo3AiChat\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Enum/*'
      - '../Classes/Exception/*'
      # Registered by Configuration/Services.php instead, and only where a
      # scripted LLM is safe to have. See the comment there.
      - '../Classes/Testing/*'
      # One instance per catalogue entry, built by McpCatalogToolProvider with
      # the entry's own name, spec and effect — there is no single autowirable
      # instance of it to register.
      - '../Classes/Tool/McpCatalogTool.php'

  Webconsulting\Typo3AiChat\Controller\ChatModuleController:
    public: true

  Webconsulting\Typo3AiChat\Controller\ChatApiController:
    public: true

  # Register the webconsulting_ai_chat_tools cache as a DI service via the
  # CacheManager factory so the catalogue projection can be injected.
  cache.webconsulting_ai_chat_tools:
    class: 'TYPO3\CMS\Core\Cache\Frontend\FrontendInterface'
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      $identifier: 'webconsulting_ai_chat_tools'

  # The MCP catalogue projection into nr-llm's agent runtime. Tagged
  # explicitly rather than by autoconfiguration: nr-llm's ToolProviderInterface
  # carries an #[AutoconfigureTag], and letting both apply would register the
  # provider twice — every tool would then collide with itself and be dropped.
  Webconsulting\Typo3AiChat\Tool\McpCatalogToolProvider:
    autoconfigure: false
    arguments:
      $cache: '@cache.webconsulting_ai_chat_tools'
    tags:
      - name: 'nr_llm.tool_provider'

  # Document extractors — tagged for DocumentExtractorRegistry
  Webconsulting\Typo3AiChat\Document\DocumentExtractorRegistry:
    arguments:
      - !tagged_iterator document.extractor

  Webconsulting\Typo3AiChat\Document\Extractor\PdfExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\DocxExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\XlsxExtractor:
    tags: ['document.extractor']

  Webconsulting\Typo3AiChat\Document\Extractor\PlainTextExtractor:
    tags: ['document.extractor']
