name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: typo3-ai-chat
      package-name: webconsulting/typo3-ai-chat
      extension-key: webconsulting_ai_chat
      # The extension is not published anywhere yet: no TER token in this
      # repo, not on Packagist (consumers use a VCS repository entry), not
      # registered on docs.typo3.org. Remove these as each channel is set up.
      skip-ter: true
      skip-packagist: true
      skip-docs: true
