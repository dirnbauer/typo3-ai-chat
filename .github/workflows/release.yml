name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-mcp-agent
      package-name: netresearch/nr-mcp-agent
      extension-key: nr_mcp_agent
      # No TYPO3_TER_ACCESS_TOKEN secret in this repo — the extension is
      # not published to TER yet. Remove this once the token is configured.
      skip-ter: true
