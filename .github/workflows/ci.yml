name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Self-contained on purpose. 2.0 supports exactly one TYPO3 line and one PHP
# floor, so the matrix a shared reusable workflow exists to manage has collapsed
# to almost nothing — and the two things this extension actually needs (a
# MariaDB service for the functional suite, an allowed-to-fail PHP 8.5 leg) are
# easier to read here than to configure from a distance.
env:
  # The MCP server fork and the abilities package come from VCS repositories.
  # The job token is not for permission — they are public — it is for the API
  # rate limit, which a matrix hits quickly without one.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  lint:
    name: Lint & coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint PHP
        run: |
          find Classes Configuration Tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Coding standards
        run: composer ci:cgl

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # One root phpstan.neon, level 10, across Classes, Configuration and
      # Tests. The two documented exceptions are written down in that file.
      - name: PHPStan
        run: composer ci:phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # 8.5 is where the next problem shows up first, and a red build on a PHP
    # version nothing runs on yet would train people to ignore CI. It reports,
    # it does not block.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            experimental: false
          - php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --ignore-platform-req=php+

      - name: Unit tests
        run: composer ci:tests:unit

  functional:
    name: Functional tests (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: funcp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # The suite runs on sqlite locally (Build/phpunit.xml), and PHPUnit's
      # <env> entries do not override an existing environment variable — so
      # setting these here is what switches the very same suite onto MariaDB,
      # which is what production actually runs.
      typo3DatabaseDriver: mysqli
      typo3DatabaseName: func_test
      typo3DatabaseUsername: root
      typo3DatabasePassword: funcp
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_mysql, mysqli, gd, zip, sodium

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Functional tests
        run: composer ci:tests:functional
