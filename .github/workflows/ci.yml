name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  quality:
    name: Code Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style check
        run: composer ci:cgl

      - name: PHPStan
        run: composer ci:phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # TYPO3 ^14.0 is excluded until saschaegerer/phpstan-typo3 and
        # typo3fluid/fluid release versions that support TYPO3 14.
        typo3: ['^13.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies (TYPO3 ${{ matrix.typo3 }})
        # The lock file targets the newest supported TYPO3; this leg re-resolves
        # the whole tree for the older branch. `require -W` cannot do that: dev
        # deps like testing-framework and phpstan-typo3 are not dependencies of
        # cms-core and stay locked, leaving only old, advisory-blocked 13.4.x
        # releases as install candidates.
        run: |
          composer require --no-interaction --no-update typo3/cms-core:"${{ matrix.typo3 }}" typo3/cms-backend:"${{ matrix.typo3 }}"
          composer update --no-interaction --no-progress

      - name: Unit tests
        run: composer ci:tests:unit

      - name: Functional tests
        run: composer ci:tests:functional

  mutation:
    name: Mutation Testing (PHP 8.3)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Mutation testing
        run: composer ci:mutation:ci

